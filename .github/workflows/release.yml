name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Release_Artifacts"
          Copy-Item "target/release/drawit.exe" "Release_Artifacts/DrawIt.exe" -Force
          Copy-Item "DrawIt_logo.ico" "Release_Artifacts/DrawIt_logo.ico" -Force
          Copy-Item "DrawIt_logo.svg" "Release_Artifacts/DrawIt_logo.svg" -Force
          Copy-Item "README.md" "Release_Artifacts/README.md" -Force
          Compress-Archive -Path "Release_Artifacts/*" -DestinationPath "DrawIt_Standalone.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release_Artifacts/DrawIt.exe
            DrawIt_Standalone.zip
          generate_release_notes: true
