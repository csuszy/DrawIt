name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Portable release binary
        run: cargo build --release

      - name: Prepare Portable release file
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Release_Artifacts"
          Copy-Item "target/release/drawit.exe" "Release_Artifacts/DrawIt.exe" -Force
          Copy-Item "target/release/drawit.exe" "DrawIt.exe" -Force

      - name: Build Microsoft Store MSIX package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File build-msix.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release_Artifacts/DrawIt.exe
            DrawIt.msix
            DrawIt - Draw on Screen Installer.exe
          generate_release_notes: true
